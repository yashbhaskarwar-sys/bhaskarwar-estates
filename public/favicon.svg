<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" fill="#080808"/>
  <!-- Outer thin square frame -->
  <rect x="6" y="6" width="52" height="52" stroke="#c9a96e" stroke-width="0.5" opacity="0.4"/>
  <!-- Inner decorative lines -->
  <line x1="6" y1="6" x2="14" y2="14" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
  <line x1="58" y1="6" x2="50" y2="14" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
  <line x1="6" y1="58" x2="14" y2="50" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
  <line x1="58" y1="58" x2="50" y2="50" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
  <!-- Letter B styled -->
  <text x="32" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="300" fill="#e8e4dc" letter-spacing="1">B</text>
  <!-- Bottom hairline -->
  <line x1="20" y1="50" x2="44" y2="50" stroke="#c9a96e" stroke-width="0.5" opacity="0.3"/>
</svg>
